<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-xl rounded-2xl shadow-lg p-6 sm:p-8">

        <h1 class="text-3xl font-bold text-center text-indigo-700 mb-2">
            Student Grade Calculator
        </h1>

        <p class="text-center text-slate-500 mb-6">
            Enter marks to calculate the student's result.
        </p>

        <form id="gradeForm">
            <label class="block font-semibold mb-2" for="studentName">
                Student Name
            </label>
            <input type="text" id="studentName" placeholder="Enter student name" required
                class="w-full border rounded-lg p-3 mb-5 focus:ring-2 focus:ring-indigo-500 outline-none">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div>
                    <label class="block font-medium mb-2" for="english">
                        English (out of 100)
                    </label>
                    <input type="number" id="english" min="0" max="100" step="any" required placeholder="Enter marks"
                        class="marks w-full border rounded-lg p-3">
                </div>

                <div>
                    <label class="block font-medium mb-2" for="maths">
                        Mathematics (out of 100)
                    </label>
                    <input type="number" id="maths" min="0" max="100" step="any" required placeholder="Enter marks"
                        class="marks w-full border rounded-lg p-3">
                </div>

                <div>
                    <label class="block font-medium mb-2" for="science">
                        Science (out of 100)
                    </label>
                    <input type="number" id="science" min="0" max="100" step="any" required placeholder="Enter marks"
                        class="marks w-full border rounded-lg p-3">
                </div>

                <div>
                    <label class="block font-medium mb-2" for="computer">
                        Computer (out of 100)
                    </label>
                    <input type="number" id="computer" min="0" max="100" step="any" required placeholder="Enter marks"
                        class="marks w-full border rounded-lg p-3">
                </div>

                <div class="sm:col-span-2">
                    <label class="block font-medium mb-2" for="social">
                        Social Science (out of 100)
                    </label>
                    <input type="number" id="social" min="0" max="100" step="any" required placeholder="Enter marks"
                        class="marks w-full border rounded-lg p-3">
                </div>

            </div>

            <button type="submit"
                class="w-full mt-6 bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">
                Calculate Result
            </button>

            <button type="reset" id="resetButton"
                class="w-full mt-3 bg-slate-200 text-slate-800 font-bold py-3 rounded-lg hover:bg-slate-300 transition">
                Clear
            </button>
        </form>

        <p id="error" class="text-red-600 text-center mt-4" role="alert"></p>

        <div id="result" class="hidden mt-6 bg-indigo-50 border border-indigo-200 rounded-xl p-5">
            <h2 class="text-xl font-bold text-indigo-800 mb-4">
                Student Result
            </h2>

            <p class="mb-2">Name: <strong id="resultName"></strong></p>
            <p class="mb-2">Total Marks: <strong id="total"></strong> / 500</p>
            <p class="mb-2">Percentage: <strong id="percentage"></strong>%</p>
            <p class="mb-2">Grade: <strong id="grade"></strong></p>
            <p>Result: <strong id="status"></strong></p>
        </div>

    </div>

    <script>
        const form = document.getElementById("gradeForm");
        const result = document.getElementById("result");
        const error = document.getElementById("error");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("studentName").value.trim();

            const subjects = ["english", "maths", "science", "computer", "social"];
            let total = 0;

            for (let subject of subjects) {
                const input = document.getElementById(subject);
                const marks = input.valueAsNumber;

                if (input.value.trim() === "" ||
                    !Number.isFinite(marks) ||
                    marks < 0 || marks > 100) {
                    error.textContent =
                        "Please enter valid marks between 0 and 100 for every subject.";
                    result.classList.add("hidden");
                    return;
                }

                total += marks;
            }

            if (name === "") {
                error.textContent = "Please enter the student's name.";
                result.classList.add("hidden");
                return;
            }

            const percentage = (total / 500) * 100;

            let grade;
            if (percentage >= 90) {
                grade = "A+";
            } else if (percentage >= 80) {
                grade = "A";
            } else if (percentage >= 70) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 40) {
                grade = "D";
            } else {
                grade = "F";
            }

            const status = percentage >= 40 ? "Pass" : "Fail";

            document.getElementById("resultName").textContent = name;
            document.getElementById("total").textContent = total;
            document.getElementById("percentage").textContent =
                percentage.toFixed(2);
            document.getElementById("grade").textContent = grade;
            document.getElementById("status").textContent = status;

            error.textContent = "";
            result.classList.remove("hidden");
        });

        form.addEventListener("reset", function () {
            result.classList.add("hidden");
            error.textContent = "";
        });
    </script>

</body>

</html>
