<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-5">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-3xl font-bold text-center text-blue-700 mb-2">
            My To-Do List
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Organize your daily tasks
        </p>

        <div class="flex gap-2 mb-5">
            <input type="text" id="taskInput" placeholder="Enter a task..."
                class="flex-1 min-w-0 border rounded-lg px-3 py-2 focus:outline-blue-500">

            <button id="addButton" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                Add
            </button>
        </div>

        <p id="message" class="text-red-600 mb-3" role="status"></p>

        <ul id="taskList" class="space-y-3"></ul>
    </div>

    <script>
        const taskInput = document.getElementById("taskInput");
        const addButton = document.getElementById("addButton");
        const taskList = document.getElementById("taskList");
        const message = document.getElementById("message");

        function addTask() {
            const taskText = taskInput.value.trim();

            if (taskText === "") {
                message.textContent = "Please enter a task.";
                return;
            }

            message.textContent = "";

            const li = document.createElement("li");
            li.className =
                "flex items-center gap-3 bg-slate-50 p-3 rounded-lg border";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "w-5 h-5 accent-blue-600";

            const taskName = document.createElement("span");
            taskName.textContent = taskText;
            taskName.className = "flex-1 break-words";

            checkbox.addEventListener("change", function () {
                taskName.classList.toggle(
                    "line-through",
                    checkbox.checked
                );

                taskName.classList.toggle(
                    "text-gray-400",
                    checkbox.checked
                );
            });

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className =
                "bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600";

            deleteButton.addEventListener("click", function () {
                li.remove();
            });

            li.appendChild(checkbox);
            li.appendChild(taskName);
            li.appendChild(deleteButton);

            taskList.appendChild(li);

            taskInput.value = "";
            taskInput.focus();
        }

        addButton.addEventListener("click", addTask);

        taskInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
    </script>
</body>

</html>
