<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #1d4ed8;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Student Registration</h2>

        <form id="registrationForm" novalidate>
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter full name">

            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter email">

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Minimum 8 characters">

            <label for="mobile">Mobile Number:</label>
            <input type="text" id="mobile" placeholder="Enter 10-digit mobile number">

            <button type="submit">Register</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </div>

    <script>
        const form = document.getElementById("registrationForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const mobile = document.getElementById("mobile").value.trim();

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const mobilePattern = /^[0-9]{10}$/;

            if (!name || !email || !password || !mobile) {
                message.style.color = "red";
                message.textContent = "Please fill in all mandatory fields.";
            }
            else if (!emailPattern.test(email)) {
                message.style.color = "red";
                message.textContent = "Please enter a valid email address.";
            }
            else if (password.length < 8) {
                message.style.color = "red";
                message.textContent =
                    "Password must contain at least 8 characters.";
            }
            else if (!mobilePattern.test(mobile)) {
                message.style.color = "red";
                message.textContent =
                    "Mobile number must contain exactly 10 digits.";
            }
            else {
                message.style.color = "green";
                message.textContent =
                    "Registration form validated successfully!";
                form.reset();
            }
        });
    </script>
</body>

</html>
